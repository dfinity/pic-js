name: check_spec_drift

on:
  schedule:
    # Every Sunday at 09:00 UTC
    - cron: '0 9 * * 0'
  workflow_dispatch:
  workflow_call:
  pull_request:

env:
  # The dfinity/developer-docs commit that pic-js is currently aligned with.
  # Update this after syncing management-canister.ts with a newer spec.
  # 2026/09/17: canister settings and status, canister log filters; the HTTP
  # outcall changes of this spec version are tracked in #302
  IC_SPEC_PINNED_COMMIT: '707596dcf4b5d55ec905368fd60f2d6b5b8981cf'

jobs:
  check_spec_drift:
    name: check_spec_drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check for spec drift
        run: bash scripts/check-spec-drift.sh "$IC_SPEC_PINNED_COMMIT"
