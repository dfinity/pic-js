name: test

on:
  merge_group:
  pull_request:

jobs:
  unit_test:
    name: unit_test:required
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PNPM
        uses: dfinity/ci-tools/actions/setup-pnpm@a98f5d0198719ad41ded2f02fa0f5e426102f369 # main

      - name: Setup
        run: pnpm run setup

      - name: Test
        run: pnpm test:pic

      # The lockfile pins a newer @icp-sdk/core, so repeat the build and tests
      # against the lowest version the peer range admits.
      - name: Test against the @icp-sdk/core peer floor
        run: |
          range=$(node -p "require('./packages/pic/package.json').peerDependencies['@icp-sdk/core']")
          floor=$(pnpm view "@icp-sdk/core@$range" version --json | node -p '[].concat(JSON.parse(require("fs").readFileSync(0, "utf8")))[0]')
          echo "Testing against @icp-sdk/core@$floor (peer range $range)"
          pnpm --filter @dfinity/pic add -D "@icp-sdk/core@$floor"
          pnpm build
          pnpm test:pic

  e2e_test_nodejs:
    name: e2e_test_nodejs:required
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PNPM
        uses: dfinity/ci-tools/actions/setup-pnpm@a98f5d0198719ad41ded2f02fa0f5e426102f369 # main

      - name: Setup
        run: pnpm run setup

      - name: Setup Canister Toolchain
        uses: ./.github/actions/setup-canister-toolchain
        with:
          package-manager: pnpm

      - name: Build
        run: pnpm run build

      - name: Build Examples
        run: pnpm build:examples

      - name: Test Examples
        run: pnpm test:examples

  consumer_install:
    name: consumer_install:required
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm, yarn, bun]
    # The opt-in mechanisms are not platform specific, and the darwin binary
    # download is covered by e2e_test_nodejs on macos-latest.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup PNPM
        uses: dfinity/ci-tools/actions/setup-pnpm@a98f5d0198719ad41ded2f02fa0f5e426102f369 # main

      - name: Setup Bun
        if: matrix.package-manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.bun-version'

      - name: Build
        run: pnpm run build

      - name: Install the packed package and run it
        run: ./scripts/smoke-test-install.sh ${{ matrix.package-manager }}
